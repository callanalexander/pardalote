# Builds pardalote-setup-<version>.exe on a Windows machine in GitHub's cloud.
#   - Push to the desktop-app branch to test a build. The installer appears
#     under Artifacts on the run's page, and no release is made.
#   - Push a tag like v1.0.0 to build it and attach it to a GitHub Release.
#   - Or run it by hand from the Actions tab (once this file is on main).
name: Build Windows installer

on:
  push:
    tags: ["v*"]
    branches: ["desktop-app"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements-build.txt

      - name: Copy the GUI out of the notebook
        run: python desktop/extract_app.py

      - name: Build the app
        working-directory: desktop
        run: pyinstaller pardalote.spec --noconfirm

      - name: Self-test the built app
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\pardalote\pardalote.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Work out the version number
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the installer
        working-directory: desktop
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" pardalote.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: pardalote-setup
          path: desktop/Output/*.exe

      - name: Attach the installer to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/Output/*.exe
